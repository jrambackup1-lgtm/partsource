<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PartSource — behavioral family workspace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172033;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;align-items:center;gap:18px;padding:0 26px;position:sticky;top:0;z-index:20}.brand{font-size:20px;font-weight:850;letter-spacing:-.7px}.brand span{color:#ff5a1f}.search{display:flex;gap:8px;flex:1;max-width:720px}.search input{width:100%;border:1px solid #aeb9c4;border-radius:5px;padding:10px 12px;background:#fbfcfd}.btn{border:1px solid #aeb9c4;background:#fff;color:#27364a;border-radius:5px;padding:9px 12px;font-weight:750;cursor:pointer}.btn:hover{border-color:#ff5a1f}.btn.primary{background:#ff5a1f;border-color:#ff5a1f;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.top .view{margin-left:auto}.shell{max-width:1450px;margin:auto;padding:22px 26px}.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.preset{border:1px solid #d5dde5;background:#fff;border-radius:99px;padding:7px 11px;color:#405069;cursor:pointer}.preset:hover{border-color:#ff8b62}.muted{color:#68778a}.tiny{font-size:11px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;color:#6d7b8c}.hero{background:#fff;border:1px solid #dce2e8;padding:20px 22px;border-radius:7px;margin-bottom:14px;display:flex;gap:20px;align-items:flex-start}.hero h1{margin:3px 0 6px;font-size:28px;line-height:1.15;letter-spacing:-.8px}.hero .shape{width:72px;height:72px;border:1px solid #d5dde5;border-radius:6px;display:grid;place-items:center;background:#f7f9fa;flex:none}.hero .shape svg{width:58px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #cfd7df;background:#f6f8fa;border-radius:99px;padding:4px 8px;font-size:12px}.chip.query{border-color:#ffbea8;background:#fff4ef;color:#a93b13}.coverage{margin-left:auto;min-width:220px;border-left:3px solid #ff5a1f;padding-left:12px}.grid{display:grid;grid-template-columns:250px minmax(500px,1fr) 340px;gap:14px;align-items:start}.card{background:#fff;border:1px solid #dce2e8;border-radius:7px}.card h2,.card h3{margin:0}.pad{padding:17px}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.facet{border-top:1px solid #e6ebef;padding:14px 0}.facet:first-of-type{border-top:0}.facet label{font-size:12px;font-weight:800;display:block;margin-bottom:7px}.options{display:flex;gap:6px;flex-wrap:wrap}.opt{border:1px solid #ccd5de;background:#fff;border-radius:4px;padding:6px 8px;cursor:pointer}.opt.active{border-color:#ff5a1f;background:#fff1ec;color:#a73710}.opt:disabled{background:#f2f4f6;color:#a2abb5;text-decoration:line-through}.notice{border:1px solid #d6dde4;border-left:3px solid #6b7d90;background:#f8fafb;border-radius:4px;padding:10px 11px;margin:12px 0}.notice.warn{border-left-color:#d88200;background:#fffaf1}.notice.bad{border-left-color:#c23a36;background:#fff6f5}.notice.info{border-left-color:#2973b8;background:#f3f8fc}.table-head{padding:15px 16px;border-bottom:1px solid #e0e6eb;display:flex;justify-content:space-between;gap:12px;align-items:center}.rows{overflow:auto}.row{display:grid;grid-template-columns:34px 1.2fr .8fr 1.35fr 1fr .85fr;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid #e6ebef;cursor:pointer;min-width:730px}.row.head{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#6b7888;font-weight:850;background:#f7f9fa;cursor:default;padding-top:9px;padding-bottom:9px}.row:not(.head):hover{background:#fbfcfd}.row.selected{background:#fff3ee;box-shadow:inset 3px 0 #ff5a1f}.radio{width:15px;height:15px;border:1px solid #9aa7b4;border-radius:50%}.selected .radio{border:5px solid #ff5a1f}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.inspector{position:sticky;top:78px;overflow:hidden}.inspector .state{border-bottom:1px solid #e1e6eb;padding:13px 17px;background:#f8fafb}.state strong{display:block}.identity{font-size:18px;font-weight:850;line-height:1.25;margin:6px 0 12px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #e0e5ea;border-radius:4px;overflow:hidden}.spec{padding:8px 9px;border-bottom:1px solid #e7ebef}.spec:nth-child(odd){border-right:1px solid #e7ebef}.spec:nth-last-child(-n+2){border-bottom:0}.spec span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#718093}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.evidence{margin-top:14px;border-top:1px solid #e2e7eb;padding-top:12px}.evidence details{border-top:1px solid #e4e9ed;padding:9px 0}.evidence details:first-of-type{border-top:0}.family-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.family{background:#fff;border:1px solid #dce2e8;border-radius:7px;padding:18px;cursor:pointer}.family:hover{border-color:#ff7b4a}.family h3{margin:7px 0 4px}.match{color:#a33b16;font-weight:750}.empty{padding:34px;text-align:center}.testbar{margin-top:14px;background:#202a38;color:#e8eef5;border-radius:6px;padding:12px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.testbar button{background:#344154;color:#fff;border:1px solid #59677a;border-radius:4px;padding:6px 8px;cursor:pointer}.testbar b{margin-right:6px}.exact-banner{border:1px solid #ffc5af;border-left:4px solid #ff5a1f;background:#fff7f3;padding:13px 15px;border-radius:5px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px}.collapsed{background:#fff;border:1px solid #dce2e8;border-radius:7px;padding:13px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}.exact-layout{max-width:760px}.exact-layout .inspector{position:static}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;border-radius:5px;padding:11px 14px;display:none;z-index:50}.toast.show{display:block}
body.phone .shell{width:390px;padding:14px 12px;margin:0}body.phone .top{width:390px;height:auto;padding:11px 12px;flex-wrap:wrap;gap:8px;position:static}body.phone .brand{font-size:18px}body.phone .search{order:3;flex:0 0 100%;width:100%;max-width:none}body.phone .view{margin-left:auto}body.phone .hero{padding:14px;gap:12px}body.phone .hero h1{font-size:22px}body.phone .hero .shape{display:none}body.phone .coverage{display:none}body.phone .grid{display:block}body.phone .grid>.card:first-child{margin-bottom:10px}body.phone .rows{overflow:visible}body.phone .row{min-width:0;grid-template-columns:24px 1fr 1fr;padding:11px 12px}body.phone .row span:nth-child(n+4){display:none}body.phone .row.head{display:none}body.phone .inspector{position:static;margin-top:10px;padding-bottom:70px}body.phone .family-list{grid-template-columns:1fr}body.phone .actions{position:fixed;bottom:0;left:0;width:390px;background:#fff;border-top:1px solid #d8e0e7;padding:10px 12px;z-index:30}body.phone .presets{overflow:auto;flex-wrap:nowrap;padding-bottom:3px}body.phone .preset{white-space:nowrap}body.phone .exact-banner{display:block}body.phone .collapsed{font-size:12px}
@media(max-width:900px){body:not(.phone) .grid{grid-template-columns:220px 1fr}.inspector{position:static;grid-column:1/-1}.family-list{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><header class="top"><div class="brand">Part<span>Source</span></div><form class="search" id="searchForm"><input id="searchInput" value="M4 socket head screw" aria-label="Search"><button class="btn primary">Resolve</button></form><button class="btn view" id="phoneToggle">Phone preview</button></header><main class="shell"><div class="presets"><button class="preset" data-q="M4 screw">M4 screw</button><button class="preset" data-q="M4 socket head screw">M4 socket head screw</button><button class="preset" data-q="DIN 912 M4 × 12">DIN 912 M4 × 12</button><button class="preset" data-q="91290A115">91290A115</button></div><div id="view"></div><div class="testbar"><b>Truth-state lab</b><button data-state="incomplete">4 records remain</button><button data-state="invalid">Invalid by rule</button><button data-state="notindexed">Not indexed</button><button data-state="unknown">Unknown</button><button data-state="clear">Clear</button></div></main><div class="toast" id="toast"></div></div>
<script>
const records=[
{id:'ps-m4-12-a',thread:'M4 × 0.7',length:'12 mm',material:'Alloy steel',finish:'Black oxide',strength:'12.9',standard:'ISO 4762',coverage:'Fully threaded'},
{id:'ps-m4-12-b',thread:'M4 × 0.7',length:'12 mm',material:'Stainless steel',finish:'Plain',strength:'A2-70',standard:'ISO 4762',coverage:'Fully threaded'},
{id:'ps-m4-16-a',thread:'M4 × 0.7',length:'16 mm',material:'Alloy steel',finish:'Black oxide',strength:'12.9',standard:'ISO 4762',coverage:'Fully threaded'},
{id:'ps-m4-20-a',thread:'M4 × 0.7',length:'20 mm',material:'Alloy steel',finish:'Zinc plated',strength:'12.9',standard:'ISO 4762',coverage:'Partially threaded'},
{id:'ps-m5-16-a',thread:'M5 × 0.8',length:'16 mm',material:'Alloy steel',finish:'Black oxide',strength:'12.9',standard:'ISO 4762',coverage:'Fully threaded'}];
const exact={id:'ps-exact-91290a115',thread:'M3 × 0.5',length:'10 mm',material:'Alloy steel',finish:'Black oxide',strength:'170,000 psi tensile',standard:'DIN 912 / ISO 4762',coverage:'Not reported'};
let S={mode:'workspace',query:'M4 socket head screw',family:'socket-head-cap-screws',thread:'M4 × 0.7',length:'',material:'',selected:null,exact:false,expanded:true,lab:''};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function push(){location.hash=encodeURIComponent(JSON.stringify(S))}function read(){if(location.hash.length>1){try{S=JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch{}}render()}
function resolve(q){q=q.trim();S={mode:'workspace',query:q,family:'socket-head-cap-screws',thread:'',length:'',material:'',selected:null,exact:false,expanded:true,lab:''};const n=q.toLowerCase();if(n==='m4 screw'){S.mode='families';S.thread='M4 × 0.7'}else if(n.includes('91290a115')){S.exact=true;S.selected=exact.id;S.thread=exact.thread;S.length=exact.length;S.expanded=false}else{if(n.includes('m4'))S.thread='M4 × 0.7';if(n.includes('12'))S.length='12 mm'}push()}
function familyChooser(){return `<section class="hero"><div><div class="eyebrow">Interpreted search</div><h1>Choose a screw family</h1><p class="muted">PartSource kept the diameter constraint but did not guess the head family.</p><div class="chips"><span class="chip query">From query: M4</span><span class="chip">3 family candidates</span></div></div></section><div class="family-list">${[['socket-head-cap-screws','Socket Head Cap Screws','Hex socket drive · cylindrical head'],['button-head-socket-screws','Button Head Socket Screws','Hex socket drive · low rounded head'],['low-head-socket-screws','Low Head Socket Screws','Hex socket drive · reduced head height']].map((f,i)=>`<article class="family" data-family="${f[0]}"><div class="eyebrow">${i===0?'Best family match':'Related family'}</div><h3>${f[1]}</h3><p class="muted">${f[2]}</p><div class="match">M4 constraint preserved →</div></article>`).join('')}</div>`}
function filtered(){return records.filter(r=>(!S.thread||r.thread===S.thread)&&(!S.length||r.length===S.length)&&(!S.material||r.material===S.material))}
function labNotice(){if(!S.lab)return'';const m={incomplete:['info','Incomplete requirement','Four published configuration records still satisfy the requirement. Select one unique row before saving or searching suppliers.'],invalid:['bad','Invalid by supported rule','This combination conflicts with the family constraint model. Change the highlighted attribute.'],notindexed:['warn','Not indexed in this release','This may be a valid engineering configuration, but no reviewed record is published in the current PartSource release.'],unknown:['info','Unknown','PartSource does not have enough reviewed evidence to decide whether this combination is valid.']}[S.lab];return `<div class="notice ${m[0]}"><strong>${m[1]}</strong><br>${m[2]}</div>`}
function inspector(){let r=S.exact?exact:records.find(x=>x.id===S.selected);if(!r)return `<aside class="card inspector"><div class="state"><span class="eyebrow">Selection state</span><strong>No unique configuration selected</strong></div><div class="pad"><p class="muted">Filters describe a requirement. Select one row before it becomes a BOM-ready configuration.</p>${labNotice()}<div class="actions"><button class="btn" disabled>Add to BOM</button><button class="btn" disabled>Search suppliers</button></div></div></aside>`;return `<aside class="card inspector"><div class="state"><span class="eyebrow">${S.exact?'Exact identifier resolution':'Selected configuration'}</span><strong>${S.exact?'Selected from a reviewed mapping':'One unique published record'}</strong></div><div class="pad"><div class="mono tiny">${r.id}</div><div class="identity">Socket Head Cap Screw · ${r.thread} × ${r.length.replace(' mm','')} mm</div><div class="specs">${[['Thread',r.thread],['Length',r.length],['Material',r.material],['Finish',r.finish],['Strength',r.strength],['Standard',r.standard],['Coverage',r.coverage],['Drive','Hex socket']].map(x=>`<div class="spec"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="actions"><button class="btn primary" data-action="bom">Add to BOM</button><button class="btn" data-action="supplier">Search suppliers</button></div><div class="evidence"><div class="eyebrow">Evidence, not a badge</div><details open><summary><b>Configuration record</b></summary><p class="tiny">PartSource-reviewed configuration record. Interaction prototype data only. Review state does not prove supplier availability or application suitability.</p></details>${S.exact?`<details open><summary><b>Identifier mapping</b></summary><p class="tiny"><span class="mono">91290A115</span> was used as an external identifier clue. A reviewed local mapping selected this configuration. This is not an equivalence claim.</p></details>`:''}</div></div></aside>`}
function workspace(){const rows=S.exact?[exact]:filtered();const count=rows.length;return `${S.exact?`<div class="exact-banner"><div><div class="eyebrow">Resolved identifier clue</div><b class="mono">91290A115</b> → one reviewed configuration record</div><div class="tiny">Not a replacement or supplier listing</div></div>`:''}<section class="hero"><div class="shape"><svg viewBox="0 0 120 80" fill="none" stroke="#3f4f60" stroke-width="3"><path d="M15 25h46v30H15zM61 32h45v16H61M27 25v30M38 25v30M49 25v30"/><circle cx="30" cy="40" r="8"/></svg></div><div><div class="eyebrow">Fasteners / Screws</div><h1>Socket Head Cap Screws</h1><p class="muted">Cylindrical head with an internal hex drive. Family context is stable; configuration facts change with selection.</p><div class="chips"><span class="chip query">Query: ${esc(S.query)}</span>${S.thread?`<span class="chip">${S.thread}</span>`:''}${S.length?`<span class="chip">${S.length}</span>`:''}</div></div><div class="coverage"><div class="eyebrow">Coverage</div><b>Prototype family workspace</b><p class="tiny muted">Counts mean records in this release, not stock or the complete engineering solution space.</p></div></section>${S.exact&&!S.expanded?`<div class="collapsed"><div><b>Family controls collapsed</b><br><span class="muted">Exact lookup stays fast. Expand to compare nearby configurations.</span></div><button class="btn" data-action="expand">Explore family</button></div><div class="exact-layout">${inspector()}</div>`:`<div class="grid"><aside class="card pad"><div class="section-title"><div><div class="eyebrow">Required selectors</div><h3>Define fit first</h3></div></div><div class="facet"><label>Measurement system</label><div class="options"><button class="opt active">Metric</button><button class="opt" disabled title="Not covered in this prototype">Inch</button></div></div><div class="facet"><label>Thread / pitch</label><div class="options">${['','M4 × 0.7','M5 × 0.8'].map(v=>`<button class="opt ${S.thread===v?'active':''}" data-thread="${v}">${v||'Any'}</button>`).join('')}</div></div><div class="facet"><label>Length</label><div class="options">${['','12 mm','16 mm','20 mm'].map(v=>`<button class="opt ${S.length===v?'active':''}" data-length="${v}">${v||'Any'}</button>`).join('')}</div></div><div class="facet"><label>Secondary facet · material</label><div class="options">${['','Alloy steel','Stainless steel'].map(v=>`<button class="opt ${S.material===v?'active':''}" data-material="${v}">${v||'Any'}</button>`).join('')}</div></div><p class="tiny muted">Prototype order: system → thread/pitch → length, then performance/compliance facets. This order remains a user-test question.</p></aside><section class="card"><div class="table-head"><div><div class="eyebrow">Published records</div><h2>${count} configuration${count===1?'':'s'} match</h2></div><span class="tiny muted">Select one unique row</span></div>${labNotice()}<div class="rows"><div class="row head"><span></span><span>Thread × length</span><span>Strength</span><span>Material / finish</span><span>Standard</span><span>Coverage</span></div>${rows.length?rows.map(r=>`<div class="row ${S.selected===r.id?'selected':''}" data-row="${r.id}"><span class="radio"></span><b>${r.thread}<br><span class="muted">${r.length}</span></b><span>${r.strength}</span><span>${r.material}<br><span class="muted">${r.finish}</span></span><span>${r.standard}</span><span>${r.coverage}</span></div>`).join(''):`<div class="empty"><b>No published records match</b><p class="muted">This does not mean the configuration is invalid or unavailable from suppliers.</p></div>`}</div></section>${inspector()}</div>`}`}
function render(){document.getElementById('searchInput').value=S.query||'';document.getElementById('view').innerHTML=S.mode==='families'?familyChooser():workspace();bind()}
function bind(){document.querySelectorAll('[data-family]').forEach(el=>el.onclick=()=>{S.mode='workspace';S.family=el.dataset.family;if(S.family!=='socket-head-cap-screws')S.lab='unknown';push()});document.querySelectorAll('[data-thread]').forEach(el=>el.onclick=()=>{S.thread=el.dataset.thread;S.selected=null;S.exact=false;push()});document.querySelectorAll('[data-length]').forEach(el=>el.onclick=()=>{S.length=el.dataset.length;S.selected=null;S.exact=false;push()});document.querySelectorAll('[data-material]').forEach(el=>el.onclick=()=>{S.material=el.dataset.material;S.selected=null;S.exact=false;push()});document.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>{S.selected=el.dataset.row;S.lab='';push()});document.querySelectorAll('[data-action="expand"]').forEach(el=>el.onclick=()=>{S.expanded=true;push()});document.querySelectorAll('[data-action="bom"]').forEach(el=>el.onclick=()=>toast('Frozen configuration added to Demo BOM'));document.querySelectorAll('[data-action="supplier"]').forEach(el=>el.onclick=()=>toast('Prototype: supplier searches would open in new tabs'))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();resolve(document.getElementById('searchInput').value)};document.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>resolve(el.dataset.q));document.querySelectorAll('[data-state]').forEach(el=>el.onclick=()=>{S.lab=el.dataset.state==='clear'?'':el.dataset.state;if(S.lab)S.selected=null;push()});document.getElementById('phoneToggle').onclick=()=>{document.body.classList.toggle('phone');document.getElementById('phoneToggle').textContent=document.body.classList.contains('phone')?'Desktop preview':'Phone preview'};window.addEventListener('hashchange',read);if(location.hash)read();else render();
</script></body></html>
