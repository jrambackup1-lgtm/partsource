<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PartSource — Supplier handoff lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172235;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,a{font:inherit}.top{height:60px;background:#fff;border-bottom:1px solid #d8e0e7;display:flex;align-items:center;gap:16px;padding:0 24px}.brand{font-weight:850;font-size:18px}.brand b{color:#ef5b2a}.tag{margin-left:auto;color:#687587;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:22px}.notice{border:1px solid #efc799;background:#fff8ed;color:#70420d;padding:11px 13px;border-radius:7px;margin-bottom:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #acbac6;background:#fff;border-radius:5px;padding:7px 9px;cursor:pointer}.tab.on{background:#172235;color:#fff;border-color:#172235}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px}.card{background:#fff;border:1px solid #d8e0e7;border-radius:8px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #e3e8ec}.head h2,.head p{margin:0}.head p{color:#697789;margin-top:4px}.body{padding:16px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:850;color:#697789}.state{display:inline-block;padding:4px 7px;border-radius:4px;background:#eef2f5;font-size:11px;font-weight:800}.state.good{background:#e8f5ec;color:#236341}.state.block{background:#fff0ec;color:#a23a20}.facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e0e6eb;border-radius:6px;overflow:hidden;margin-top:13px}.fact{padding:10px 12px;border-bottom:1px solid #e7ebef}.fact:nth-child(odd){border-right:1px solid #e7ebef}.fact:nth-last-child(-n+2){border-bottom:0}.fact small{display:block;color:#738091;text-transform:uppercase;font-size:9px;font-weight:800}.fact b{display:block;margin-top:2px}.formats{display:flex;gap:6px;margin-bottom:12px}.format{border:1px solid #acbac6;background:#fff;border-radius:4px;padding:6px 8px;cursor:pointer}.format.on{border-color:#ef5b2a;color:#a53d19;background:#fff6f1}.query{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:#172235;color:#f3f7fb;padding:12px;border-radius:6px;white-space:pre-wrap;word-break:break-word}.dest{display:grid;grid-template-columns:80px 1fr auto;gap:9px;align-items:start;padding:11px 0;border-bottom:1px solid #e6ebef}.dest:last-child{border-bottom:0}.dest b{font-size:12px}.dest code{font-size:10px;color:#556476;word-break:break-word}.open{display:inline-block;background:#172235;color:#fff;text-decoration:none;border-radius:4px;padding:6px 8px;font-size:11px;font-weight:800}.copy{border:1px solid #9eacb8;background:#fff;border-radius:4px;padding:7px 9px;cursor:pointer;font-weight:750}.blocked{border:1px solid #efc2b8;background:#fff4f1;color:#783624;border-radius:6px;padding:13px}.fine{color:#6e7b8b;font-size:11px;margin-top:10px}.packet{white-space:pre-wrap}.source{display:flex;gap:8px;align-items:center;margin-top:14px}.toast{position:fixed;right:18px;bottom:18px;background:#172235;color:#fff;padding:10px 13px;border-radius:6px;display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.fact:nth-child(odd){border-right:0}.fact{border-bottom:1px solid #e7ebef!important}.fact:last-child{border-bottom:0!important}.dest{grid-template-columns:1fr}.top{padding:0 14px}.wrap{padding:14px}}
</style></head><body><header class="top"><div class="brand">Part<b>Source</b></div><strong>Supplier handoff lab</strong><div class="tag">Labeled fixtures · no commercial claims</div></header><main class="wrap"><div class="notice"><b>Compiler experiment only.</b> A query is not a listing or offer. No destination shown here proves identity, equivalence, price, stock, availability, compatibility, or suitability.</div><div class="tabs" id="tabs"></div><div class="layout"><section class="card" id="case"></section><aside class="card" id="handoff"></aside></div></main><div class="toast" id="toast">Copied fixture text</div><script>
const cases=[
{id:'exact',label:'Exact ID',state:'exact-id',title:'User-supplied McMaster identifier',raw:'91290A115',note:'Opening the source supplier preserves the identifier without translating it into an alternate-supplier claim.',source:true,block:'Configuration translation remains blocked until an active reviewed mapping and release exist.'},
{id:'full',label:'Fully specified',state:'configuration-selected',title:'Selected configuration compiler fixture',raw:'M3 × 0.5 × 10 mm socket head cap screw; alloy steel; black oxide; hex socket; ISO 4762 / DIN 912',note:'All fixture facts are explicit. This is not a current released catalog claim.',full:true},
{id:'partial',label:'Partial',state:'partial',title:'Incomplete requirement',raw:'M4 socket head cap screw',note:'Length, material, finish, and other family-required facts remain unresolved.',block:'Block supplier opening. Preserve the requirement and return to configuration.'},
{id:'conflict',label:'Conflict',state:'conflict',title:'Conflicting pitch',raw:'M4 × 1.5 × 12 mm; selected record says M4 × 0.7 × 12 mm',note:'Two selection-critical pitch claims disagree.',block:'Block supplier opening. Show both claims; never compile the selected record over the supplied input.'},
{id:'unsupported',label:'Unsupported',state:'unsupported',title:'Unsupported family',raw:'BRG-608ZZ deep groove bearing',note:'Bearing identity and required fields are outside this fastener fixture.',block:'Block supplier opening. Preserve unchanged; do not emit “custom fastener”.'},
{id:'unavailable',label:'Unavailable',state:'service-unavailable',title:'Configuration service unavailable',raw:'91290A115',note:'The resolver did not complete a trustworthy evaluation.',block:'Block supplier opening and remove stale configuration output. Keep input and permit retry.'},
{id:'confidential',label:'Confidential',state:'confidential-boundary',title:'Confidential-source boundary',raw:'Reviewed public technical facts plus private origin, raw row ID, source SKU, and lineage notes',note:'Only reviewed public configuration fields may cross the browser/handoff boundary.',block:'Block export until private origin, raw row ID, source SKU, lineage, and unapproved mapping data are removed.'}
];
const facts=[['Family','Socket head cap screw'],['Thread','M3 × 0.5'],['Length','10 mm'],['Material','Alloy steel'],['Finish','Black oxide'],['Drive','Hex socket'],['Referenced standard','ISO 4762 / DIN 912'],['Release','Compiler fixture — not released']];
const generic='M3 socket head cap screw 10mm black-oxide alloy steel';
const packet='SUPPLIER SEARCH HANDOFF — VERIFY INDEPENDENTLY\nFamily: Socket head cap screw\nThread: M3 × 0.5\nLength: 10 mm\nMaterial: Alloy steel\nFinish: Black oxide\nDrive: Hex socket\nReferenced standard: ISO 4762 / DIN 912\nRelease status: Compiler fixture — not released\nExcluded claims: listing, offer, equivalence, suitability, price, stock, availability';
const destinations=[
{name:'Zoro',query:'M3 socket head cap screw 10mm black-oxide alloy steel',url:'https://www.zoro.com/search?q='},
{name:'MSC',query:'M3x0.5 10.00 mm hex socket cap screw alloy steel black oxide',url:'https://www.mscdirect.com/browse/tn?searchterm='},
{name:'Fastenal',query:'M3-0.5 x 10mm socket head cap screw ISO 4762 black oxide alloy steel',url:'https://www.fastenal.com/products/search?term='}
];
let selected='full',format='packet';const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){const c=cases.find(x=>x.id===selected);document.getElementById('tabs').innerHTML=cases.map(x=>`<button class="tab ${x.id===selected?'on':''}" data-case="${x.id}">${esc(x.label)}</button>`).join('');document.getElementById('case').innerHTML=`<div class="head"><span class="eyebrow">Fixture state</span><h2>${esc(c.title)}</h2><p>${esc(c.note)}</p></div><div class="body"><span class="state ${c.full?'good':c.block?'block':''}">${esc(c.state)}</span><div class="query" style="margin-top:12px">Preserved input: ${esc(c.raw)}</div>${c.full?`<div class="facts">${facts.map(f=>`<div class="fact"><small>${esc(f[0])}</small><b>${esc(f[1])}</b></div>`).join('')}</div>`:''}${c.source?`<div class="source"><a class="open" target="_blank" rel="noreferrer" href="https://www.mcmaster.com/91290A115">Open user-supplied ID at McMaster</a><button class="copy" data-copy="McMaster identifier: 91290A115">Copy ID</button></div><p class="fine">Direct source opening does not assert a PartSource mapping or any alternate-supplier identity.</p>`:''}${c.block?`<div class="blocked" style="margin-top:13px"><b>Handoff blocked</b><br>${esc(c.block)}</div>`:''}</div>`;
if(c.full){document.getElementById('handoff').innerHTML=`<div class="head"><span class="eyebrow">Secondary completion action</span><h2>Review what leaves PartSource</h2><p>Destination results may be empty, broad, blocked, or irrelevant.</p></div><div class="body"><div class="formats"><button class="format ${format==='generic'?'on':''}" data-format="generic">Generic link</button><button class="format ${format==='specific'?'on':''}" data-format="specific">Destination syntax</button><button class="format ${format==='packet'?'on':''}" data-format="packet">Copy packet</button></div>${handoffBody()}</div>`}else{document.getElementById('handoff').innerHTML=`<div class="head"><span class="eyebrow">Supplier action</span><h2>${c.source?'Source-direct only':'No destination emitted'}</h2><p>Fail closed rather than converting uncertainty into supplier theatre.</p></div><div class="body"><div class="blocked">No alternate-supplier query or link is available for this fixture state.</div></div>`}
document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{selected=b.dataset.case;format='packet';render()});document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{format=b.dataset.format;render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));}
function handoffBody(){if(format==='packet')return `<div class="query packet">${esc(packet)}</div><button class="copy" style="margin-top:10px" data-copy="${esc(packet)}">Copy fact packet</button><p class="fine">8/8 fixture fields are visible; private source identity and commercial claims are absent.</p>`;if(format==='generic')return `<div class="query">${esc(generic)}</div><button class="copy" style="margin-top:10px" data-copy="${esc(generic)}">Copy generic query</button><p class="fine">5/8 fixture fields preserved: pitch, drive, and referenced standard are omitted. This mirrors the current compiler and needs review.</p>`;return destinations.map(d=>`<div class="dest"><b>${esc(d.name)}</b><code>${esc(d.query)}</code><a class="open" target="_blank" rel="noreferrer" href="${d.url+encodeURIComponent(d.query)}">Open search</a></div>`).join('')+`<p class="fine">Each query is editable and inspectable. Different syntax does not imply better results.</p>`}
function copy(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(()=>{});const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1200)}render();
</script></body></html>
